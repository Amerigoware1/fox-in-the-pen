<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colton's 12th Birthday Bowling Bash!</title>
    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-pink: #ff2d78;
            --neon-yellow: #ffdd00;
            --neon-green: #39ff14;
            --deep-purple: #1a0a2e;
            --bowling-red: #e63946;
            --bowling-white: #f1faee;
            --bowling-black: #111111;
            --gold-sparkle: #ffd700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0518 50%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
            cursor: default;
            user-select: none;
        }

        /* ===== CONFETTI FALLING ===== */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 18px;
            border-radius: 3px;
            animation: confettiFall linear infinite;
            opacity: 0.85;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(1);
                opacity: 0.9;
            }
            25% {
                transform: translateY(25vh) rotate(180deg) scale(0.95);
                opacity: 0.85;
            }
            50% {
                transform: translateY(50vh) rotate(360deg) scale(1);
                opacity: 0.8;
            }
            75% {
                transform: translateY(75vh) rotate(540deg) scale(0.95);
                opacity: 0.85;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(1);
                opacity: 0;
            }
        }

        /* ===== MAIN INVITATION CARD ===== */
        .invitation-card {
            position: relative;
            z-index: 10;
            width: 480px;
            max-width: 95vw;
            background: linear-gradient(145deg, 
    rgba(30, 16, 53, 0.85) 0%, 
    rgba(42, 22, 72, 0.85) 40%, 
    rgba(26, 10, 46, 0.85) 100%);
            border-radius: 28px;
            padding: 35px 30px 40px;
            text-align: center;
            border: 3px solid transparent;
            background-clip: padding-box;
            box-shadow:
                0 0 60px rgba(0, 212, 255, 0.3),
                0 0 120px rgba(255, 45, 120, 0.2),
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: cardGlow 3s ease-in-out infinite;
            position: relative;
        }

        .invitation-card::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 28px;
            padding: 3px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink), var(--neon-yellow), var(--neon-green), var(--neon-blue));
            background-size: 300% 300%;
            animation: borderGradient 6s ease infinite;
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes borderGradient {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes cardGlow {
            0%,
            100% {
                box-shadow:
                    0 0 60px rgba(0, 212, 255, 0.3),
                    0 0 120px rgba(255, 45, 120, 0.2),
                    0 20px 60px rgba(0, 0, 0, 0.6),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);
            }
            50% {
                box-shadow:
                    0 0 80px rgba(0, 212, 255, 0.5),
                    0 0 160px rgba(255, 45, 120, 0.35),
                    0 20px 60px rgba(0, 0, 0, 0.6),
                    inset 0 1px 0 rgba(255, 255, 255, 0.08);
            }
        }

        /* ===== BOWLING SCENE ===== */
        .bowling-scene {
            position: relative;
            height: 180px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1;
        }

        /* Lane */
        .bowling-lane {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 60px;
            background: linear-gradient(180deg, #3d2a1a 0%, #5a3d28 30%, #7a5435 70%, #8b6343 100%);
            border-radius: 6px 6px 0 0;
            border: 2px solid #2a1a0a;
            box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.5), 0 4px 20px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .bowling-lane::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 8px,
                    rgba(255, 255, 255, 0.05) 8px,
                    rgba(255, 255, 255, 0.05) 10px);
            border-left: 3px solid rgba(255, 255, 255, 0.15);
            border-right: 3px solid rgba(255, 255, 255, 0.15);
        }

        /* Lane arrows */
        .lane-arrows {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 2;
        }
        .lane-arrows span {
            width: 18px;
            height: 18px;
            border-top: 3px solid rgba(255, 255, 255, 0.5);
            border-right: 3px solid rgba(255, 255, 255, 0.5);
            transform: rotate(45deg);
            animation: arrowPulse 1.5s ease-in-out infinite;
        }
        .lane-arrows span:nth-child(2) {
            animation-delay: 0.3s;
        }
        .lane-arrows span:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes arrowPulse {
            0%,
            100% {
                opacity: 0.3;
                transform: rotate(45deg) scale(0.9);
            }
            50% {
                opacity: 1;
                transform: rotate(45deg) scale(1.1);
            }
        }

        /* Bowling Pins */
        .pins-container {
            position: absolute;
            bottom: 55px;
            right: 10%;
            display: flex;
            gap: 8px;
            z-index: 3;
            animation: pinsWobble 2s ease-in-out infinite;
        }

        .pin {
            width: 20px;
            height: 40px;
            background: linear-gradient(180deg, #fff 0%, #f0f0f0 40%, #e8e8e8 60%, #ddd 100%);
            border-radius: 50% 50% 30% 30% / 60% 60% 30% 30%;
            border: 1.5px solid #bbb;
            position: relative;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3), inset 0 -3px 6px rgba(0, 0, 0, 0.15);
            animation: pinGlow 1.5s ease-in-out infinite;
        }

        .pin::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #e63946;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(230, 57, 70, 0.7);
            animation: pinStripePulse 1.5s ease-in-out infinite;
        }

        .pin::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            border: 1px solid #ccc;
        }

        .pin:nth-child(1) {
            animation-delay: 0s;
            transform: translateY(0);
        }
        .pin:nth-child(2) {
            animation-delay: 0.3s;
            transform: translateY(-3px);
        }
        .pin:nth-child(3) {
            animation-delay: 0.15s;
            transform: translateY(-6px);
        }
        .pin:nth-child(4) {
            animation-delay: 0.45s;
            transform: translateY(-3px);
        }
        .pin:nth-child(5) {
            animation-delay: 0.6s;
            transform: translateY(0);
        }

        @keyframes pinGlow {
            0%,
            100% {
                filter: brightness(1);
                box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3), inset 0 -3px 6px rgba(0, 0, 0, 0.15);
            }
            50% {
                filter: brightness(1.15);
                box-shadow: 0 3px 12px rgba(0, 212, 255, 0.5), inset 0 -3px 6px rgba(0, 0, 0, 0.15);
            }
        }

        @keyframes pinStripePulse {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(230, 57, 70, 0.7);
                width: 8px;
            }
            50% {
                box-shadow: 0 0 16px rgba(230, 57, 70, 1);
                width: 9px;
            }
        }

        @keyframes pinsWobble {
            0%,
            100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(1.5deg);
            }
            50% {
                transform: rotate(0deg);
            }
            75% {
                transform: rotate(-1.5deg);
            }
        }

        /* Bowling Ball */
        .ball-container {
            position: absolute;
            bottom: 8px;
            left: 12%;
            z-index: 4;
            animation: ballRoll 3.5s ease-in-out infinite;
        }

        .bowling-ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #e63946 0%, #c1121f 30%, #8b0000 60%, #5a0000 100%);
            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.5),
                inset 0 -5px 15px rgba(0, 0, 0, 0.4),
                inset 0 3px 10px rgba(255, 255, 255, 0.2);
            position: relative;
            animation: ballSpin 2s linear infinite;
        }

        .bowling-ball::before {
            content: '';
            position: absolute;
            top: 18%;
            left: 18%;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            box-shadow: 15px 8px 0 rgba(255, 255, 255, 0.15), 25px -3px 0 rgba(255, 255, 255, 0.1);
        }

        .bowling-ball::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
        }

        @keyframes ballRoll {
            0% {
                transform: translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            45% {
                transform: translateX(180px);
            }
            60% {
                transform: translateX(190px);
                opacity: 1;
            }
            70% {
                transform: translateX(180px);
                opacity: 0;
            }
            85% {
                transform: translateX(0);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 0;
            }
        }

        @keyframes ballSpin {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        /* Impact Effect */
        .impact-effect {
            position: absolute;
            bottom: 40px;
            right: 8%;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            animation: impactBurst 3.5s ease-in-out infinite;
        }

        .impact-effect span {
            position: absolute;
            width: 6px;
            height: 20px;
            border-radius: 3px;
            background: linear-gradient(180deg, #ffdd00, #ff8800);
            box-shadow: 0 0 10px rgba(255, 200, 0, 0.8);
        }

        .impact-effect span:nth-child(1) {
            transform: rotate(0deg) translateY(-25px);
            animation: starFly 0.6s ease-out infinite;
        }
        .impact-effect span:nth-child(2) {
            transform: rotate(60deg) translateY(-25px);
            animation: starFly 0.6s ease-out infinite 0.1s;
        }
        .impact-effect span:nth-child(3) {
            transform: rotate(120deg) translateY(-25px);
            animation: starFly 0.6s ease-out infinite 0.2s;
        }
        .impact-effect span:nth-child(4) {
            transform: rotate(180deg) translateY(-25px);
            animation: starFly 0.6s ease-out infinite 0.3s;
        }
        .impact-effect span:nth-child(5) {
            transform: rotate(240deg) translateY(-25px);
            animation: starFly 0.6s ease-out infinite 0.4s;
        }
        .impact-effect span:nth-child(6) {
            transform: rotate(300deg) translateY(-25px);
            animation: starFly 0.6s ease-out infinite 0.5s;
        }

        @keyframes impactBurst {
            0%,
            50%,
            100% {
                opacity: 0;
            }
            52% {
                opacity: 1;
            }
            65% {
                opacity: 1;
            }
            70% {
                opacity: 0;
            }
        }

        @keyframes starFly {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* ===== TEXT CONTENT ===== */
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--neon-yellow), #ffaa00);
            color: #1a0a2e;
            font-weight: 900;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 50px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(255, 221, 0, 0.5);
            animation: badgePulse 2s ease-in-out infinite;
            z-index: 1;
            position: relative;
        }

        @keyframes badgePulse {
            0%,
            100% {
                box-shadow: 0 4px 15px rgba(255, 221, 0, 0.5);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 4px 30px rgba(255, 221, 0, 0.8);
                transform: scale(1.05);
            }
        }

        .title {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 6px;
            letter-spacing: -1px;
            z-index: 1;
            position: relative;
            background: linear-gradient(135deg, #ffdd00 0%, #ff9500 30%, #ff2d78 60%, #00d4ff 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGradient 3s ease-in-out infinite;
            filter: drop-shadow(0 2px 8px rgba(255, 100, 50, 0.5));
        }

        @keyframes titleGradient {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e0d6ff;
            margin-bottom: 5px;
            letter-spacing: 1px;
            z-index: 1;
            position: relative;
            text-shadow: 0 0 20px rgba(160, 120, 255, 0.5);
            animation: subtitleShimmer 3s ease-in-out infinite;
        }

        @keyframes subtitleShimmer {
            0%,
            100% {
                opacity: 0.85;
                text-shadow: 0 0 20px rgba(160, 120, 255, 0.5);
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 35px rgba(160, 120, 255, 0.9);
            }
        }

        .turning-12 {
            font-size: 1.1rem;
            color: #ff9a9a;
            font-weight: 600;
            margin-bottom: 18px;
            z-index: 1;
            position: relative;
            letter-spacing: 2px;
        }

        .turning-12 .big-12 {
            font-size: 3rem;
            font-weight: 900;
            color: var(--neon-yellow);
            display: inline-block;
            animation: big12Bounce 1.5s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(255, 221, 0, 0.8), 0 0 40px rgba(255, 221, 0, 0.4);
            margin: 0 4px;
        }

        @keyframes big12Bounce {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            30% {
                transform: translateY(-10px) scale(1.1);
            }
            50% {
                transform: translateY(0) scale(1);
            }
            70% {
                transform: translateY(-5px) scale(1.05);
            }
        }

        .details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 18px 0;
            z-index: 1;
            position: relative;
        }

        .detail-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            animation: detailGlow 2.5s ease-in-out infinite;
        }

        .detail-row:nth-child(1) {
            animation-delay: 0s;
        }
        .detail-row:nth-child(2) {
            animation-delay: 0.5s;
        }
        .detail-row:nth-child(3) {
            animation-delay: 1s;
        }
        .detail-row:nth-child(4) {
            animation-delay: 1.5s;
        }

        .detail-row:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.03);
        }

        @keyframes detailGlow {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(0, 212, 255, 0.1);
            }
            50% {
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.25);
            }
        }

        .detail-icon {
            font-size: 1.5rem;
            animation: iconBounce 2s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255, 200, 100, 0.6));
        }

        @keyframes iconBounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        .detail-text {
            color: #e8e0f5;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .detail-text strong {
            color: #fff;
            font-weight: 700;
        }

        .rsvp {
            margin-top: 14px;
            font-size: 0.85rem;
            color: #bbbbdd;
            z-index: 1;
            position: relative;
        }

        .rsvp .phone {
            color: var(--neon-yellow);
            font-weight: 700;
            letter-spacing: 1px;
            animation: phoneGlow 2s ease-in-out infinite;
        }

        @keyframes phoneGlow {
            0%,
            100% {
                text-shadow: 0 0 5px rgba(255, 221, 0, 0.5);
            }
            50% {
                text-shadow: 0 0 15px rgba(255, 221, 0, 0.9);
            }
        }

        /* ===== FLOATING ELEMENTS ===== */
        .floating-element {
            position: absolute;
            pointer-events: none;
            z-index: 2;
            animation: floatAround 6s ease-in-out infinite;
            opacity: 0.7;
        }

        .floating-element:nth-child(1) {
            top: -20px;
            left: -15px;
            font-size: 2rem;
            animation-delay: 0s;
            animation-duration: 5s;
        }
        .floating-element:nth-child(2) {
            top: -10px;
            right: -10px;
            font-size: 1.8rem;
            animation-delay: 1s;
            animation-duration: 6s;
        }
        .floating-element:nth-child(3) {
            bottom: -15px;
            left: 20%;
            font-size: 1.5rem;
            animation-delay: 2s;
            animation-duration: 7s;
        }
        .floating-element:nth-child(4) {
            bottom: -10px;
            right: 15%;
            font-size: 2.2rem;
            animation-delay: 0.5s;
            animation-duration: 5.5s;
        }

        @keyframes floatAround {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-12px) rotate(8deg);
            }
            50% {
                transform: translateY(0) rotate(0deg);
            }
            75% {
                transform: translateY(8px) rotate(-8deg);
            }
        }

        /* ===== SPARKLE TEXT ===== */
        .sparkle {
            display: inline-block;
            animation: sparkleTwinkle 1.5s ease-in-out infinite;
            color: var(--gold-sparkle);
        }

        @keyframes sparkleTwinkle {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 520px) {
            .invitation-card {
                padding: 25px 18px 30px;
                border-radius: 20px;
                margin: 10px;
            }
            .title {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 1.2rem;
            }
            .bowling-scene {
                height: 130px;
            }
            .pins-container {
                right: 5%;
                gap: 5px;
                bottom: 45px;
            }
            .pin {
                width: 14px;
                height: 30px;
            }
            .bowling-ball {
                width: 36px;
                height: 36px;
            }
            .ball-container {
                bottom: 6px;
                left: 8%;
            }
            .turning-12 .big-12 {
                font-size: 2.2rem;
            }
            .detail-text {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Confetti Background -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Main Invitation Card -->
    <div class="invitation-card">
        <!-- Floating Decorations -->
        <span class="floating-element">🎳</span>
        <span class="floating-element">🎱</span>
        <span class="floating-element">🎯</span>
        <span class="floating-element">🏆</span>

        <!-- Badge -->
        <div class="badge">🎳 You're Invited! 🎳</div>

        <!-- Title -->
        <h1 class="title">COLTON'S<br>BIRTHDAY<br>BOWLING BASH</h1>

        <!-- Turning 12 -->
        <div class="turning-12">
            <span class="sparkle">✨</span>
            He's Turning
            <span class="big-12">12</span>
            <span class="sparkle">✨</span>
        </div>

        <!-- Bowling Animation Scene -->
        <div class="bowling-scene">
            <!-- Lane -->
            <div class="bowling-lane">
                <div class="lane-arrows">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <!-- Pins -->
            <div class="pins-container">
                <div class="pin"></div>
                <div class="pin"></div>
                <div class="pin"></div>
                <div class="pin"></div>
                <div class="pin"></div>
            </div>

            <!-- Bowling Ball -->
            <div class="ball-container">
                <div class="bowling-ball"></div>
            </div>

            <!-- Impact Effect -->
            <div class="impact-effect">

    <script>
        // ===== CONFETTI GENERATOR =====
        (function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = [
                '#ff2d78', '#ffdd00', '#00d4ff', '#39ff14', '#ff8800',
                '#c084fc', '#f472b6', '#fbbf24', '#34d399', '#60a5fa',
                '#e63946', '#ffd700', '#ff6b6b', '#4ecdc4', '#a78bfa'
            ];
            const numConfetti = 45;

            for (let i = 0; i < numConfetti; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 8 + 5) + 'px';
                confetti.style.height = (Math.random() * 14 + 8) + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
                confetti.style.animationDuration = (Math.random() * 4 + 3) + 's';
                confetti.style.animationDelay = (Math.random() * 6) + 's';
                confetti.style.opacity = Math.random() * 0.6 + 0.3;
                container.appendChild(confetti);
            }
        })();

        // ===== DYNAMIC PIN RESET ANIMATION =====
        // The pins wobble continuously, but we can add a little "strike" burst
        // by dynamically toggling a class. Let's keep it simple with CSS animations
        // already in place.

        // ===== SUBTLE INTERACTIVE TOUCH =====
        document.querySelector('.invitation-card')?.addEventListener('click', function(e) {
            // Create a little ripple effect on click
            const ripple = document.createElement('div');
            ripple.style.cssText = `
                        position: absolute;
                        border-radius: 50%;
                        background: rgba(255,255,255,0.15);
                        width: 20px;
                        height: 20px;
                        pointer-events: none;
                        z-index: 20;
                        animation: clickRipple 0.6s ease-out forwards;
                    `;
            const rect = this.getBoundingClientRect();
            ripple.style.left = (e.clientX - rect.left - 10) + 'px';
            ripple.style.top = (e.clientY - rect.top - 10) + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 700);
        });

        // Add keyframes for click ripple dynamically
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
                    @keyframes clickRipple {
                        0% { transform: scale(0.5); opacity: 1; }
                        100% { transform: scale(8); opacity: 0; }
                    }
                `;
        document.head.appendChild(styleSheet);

        console.log('🎳 Happy 12th Birthday, Colton! 🎉');
    </script>
